<style>
/* Layout: a review docket. Sticky tab rail of five reviewers; each reviewer's points are rows you rule on (agree / partly / disagree) with a note. Korean first, English original beneath. */
:root {

  --display: "Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151311; --surface: #1e1b18; --sunk: #262220; --ink: #ece7e1; --muted: #a39b92; --line: #35302b;
  --accent: #d9a57a; --accent-ink: #1d1b19;
  --agree: #66c48d; --partly: #e2a84e; --disagree: #ec7b6f;
  --agree-bg: #1d3226; --partly-bg: #382a14; --disagree-bg: #3a1f1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151311; --surface: #1e1b18; --sunk: #262220; --ink: #ece7e1; --muted: #a39b92; --line: #35302b;
  --accent: #d9a57a; --accent-ink: #1d1b19;
  --agree: #66c48d; --partly: #e2a84e; --disagree: #ec7b6f;
  --agree-bg: #1d3226; --partly-bg: #382a14; --disagree-bg: #3a1f1c; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 18px; display: grid; gap: 10px }
.eyebrow { font: 500 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
h1 { font: 800 clamp(26px, 5vw, 38px)/1.1 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.sub { color: var(--muted); margin: 0; max-width: 62ch }
.headrow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between }
.store-note { font-size: 13px; color: var(--muted) }
.store-note.warn { color: var(--partly) }

/* language */
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.lang button { font: 500 13px var(--body); padding: 5px 11px; border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer }
.lang button:last-child { border-right: 0 }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.rounds { justify-self: start }
.rounds button { font: 600 14px var(--body); padding: 8px 16px }
.rounds button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.t-ko, .t-en { display: block }
body[data-lang="both"] .t-en { color: var(--muted); font-size: .88em; margin-top: 4px; font-weight: 400; font-family: var(--body) }
body[data-lang="ko"] .t-en { display: none !important }
body[data-lang="en"] .t-ko { display: none !important }
body[data-lang="en"] .ko { display: none !important }

nav.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin }
.tab { flex: 0 0 auto; display: grid; gap: 2px; text-align: left; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; min-width: 92px }
.tab:hover { border-color: var(--muted) }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.tab .r { font: 600 15px/1.2 var(--display) }
.tab .p { font: 500 11px/1.2 var(--mono); opacity: .75; font-variant-numeric: tabular-nums }
.meter { height: 3px; background: var(--sunk); border-radius: 2px; overflow: hidden; margin-top: 4px }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s }
.tab[aria-selected="true"] .meter { background: color-mix(in srgb, var(--bg) 25%, transparent) }
.tab[aria-selected="true"] .meter i { background: var(--bg) }

main { padding-block: 22px 64px; display: grid; gap: 28px }
.who { display: grid; gap: 8px }
.who h2 { font: 800 28px/1.15 var(--display); margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px }
.who h2 small { font: 500 14px var(--body); color: var(--muted) }
.verdict { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; font: 600 13px var(--body); width: fit-content }
.verdict.bad { background: var(--disagree-bg); color: var(--disagree) }
.verdict.mid { background: var(--partly-bg); color: var(--partly) }
.lead { margin: 0; max-width: 65ch; color: var(--ink) }

section.block { display: grid; gap: 10px }
.block > h3 { font: 500 12px/1.4 var(--mono); letter-spacing: .06em; color: var(--muted); margin: 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.block > h3 .t-en { display: inline; margin: 0 0 0 6px; font-size: 1em }
body[data-lang="both"] .block > h3 .t-en::before { content: "· " }

.point { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; border-left-width: 4px; min-width: 0 }
.point[data-stance="agree"] { border-left-color: var(--agree) }
.point[data-stance="partly"] { border-left-color: var(--partly) }
.point[data-stance="disagree"] { border-left-color: var(--disagree) }
.point h4 { margin: 0; font: 600 17px/1.4 var(--display); text-wrap: balance }
.point .num { display: block; font: 500 12px var(--mono); color: var(--muted); margin-bottom: 2px }
.point .txt { margin: 0; max-width: 68ch; min-width: 0 }
.ko { font-size: 14px; color: var(--ink); background: var(--sunk); border-radius: 6px; padding: 6px 10px; margin: 0 }
.ko b { font-weight: 600; color: var(--accent); margin-right: 6px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.compact { padding: 12px 14px; gap: 8px }
.compact .txt { font-size: 14.5px }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 0 0 auto }
.seg button { font: 500 13px var(--body); padding: 6px 12px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; border-right: 1px solid var(--line) }
.seg button:last-child { border-right: 0 }
.seg button:hover { color: var(--ink); background: var(--sunk) }
.seg button[aria-pressed="true"][data-v="agree"] { background: var(--agree); color: var(--surface) }
.seg button[aria-pressed="true"][data-v="partly"] { background: var(--partly); color: var(--surface) }
.seg button[aria-pressed="true"][data-v="disagree"] { background: var(--disagree); color: var(--surface) }
.notebtn { font: 500 13px var(--body); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 4px }
textarea { width: 100%; min-height: 64px; resize: vertical; font: 14px/1.5 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
textarea::placeholder { color: var(--muted) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.numbers { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.numbers table { border-collapse: collapse; width: 100%; font-size: 14px }
.numbers td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top }
.numbers tr:last-child td { border-bottom: 0 }
.numbers td:first-child { color: var(--muted); white-space: nowrap }
.numbers td:last-child { font-variant-numeric: tabular-nums }

.overall { background: var(--sunk); border-radius: 10px; padding: 16px; display: grid; gap: 10px }
.overall h3 { margin: 0; font: 600 16px var(--display) }
.stars { display: flex; gap: 6px; flex-wrap: wrap }
.stars button { font: 500 13px var(--body); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.stars button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px }
.tally b { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums }
.tally span { font-size: 13px; color: var(--muted) }
.tally .a b { color: var(--agree) } .tally .p b { color: var(--partly) } .tally .d b { color: var(--disagree) }
@media (max-width: 560px) { .tally { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

.theme { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px }
.theme strong { font-weight: 600 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--sunk); color: var(--ink); border: 0; cursor: pointer }
.chip.off { opacity: .35; cursor: default }

.list { display: grid; gap: 8px }
.li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; border-left-width: 4px; min-width: 0 }
.li[data-stance="agree"] { border-left-color: var(--agree) }
.li[data-stance="partly"] { border-left-color: var(--partly) }
.li[data-stance="disagree"] { border-left-color: var(--disagree) }
.li .src { font: 500 11px var(--mono); color: var(--muted) }
.li .note { font-size: 14px; color: var(--ink); background: var(--bg); border-radius: 6px; padding: 6px 8px }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0 }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { font: 600 14px var(--body); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer }
.toast { font-size: 13px; color: var(--muted) }
#copybox { width: 100%; min-height: 160px; font: 13px/1.5 var(--mono) }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px }
@media (max-width: 720px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<script>
// Every text is [English original, Korean translation].
const REVIEWERS = [
{ id: "ceo", role: "CEO", area: "경영 · 전략", verdict: "Don’t fund", verdictKo: "투자 안 함", tone: "bad",
  lead: ["For now this is a hobby project with a pitch-deck paragraph attached. I’ll look again after M0 if it passes the kill criteria the PRD sets for itself.",
         "지금은 피치덱 문단 하나가 붙은 취미 프로젝트다. M0에서 PRD가 스스로 정한 중단 기준을 통과하면 다시 보겠다."],
  objections: [
    { t: ["The only evidence you have argues against building this", "지금 가진 유일한 근거가 만들지 말라고 말한다"],
      b: ["The PRD has one interview, and that interviewee says the problem doesn’t matter (“It wasn’t a big problem, so I didn’t try.”). The pain figures (“3–5 times a week”, “at least 30 minutes”) describe the founder, written in first person. Section 10 says to stop if interviewees say it is not a big problem, so by the founder’s own rule the evidence already points to stopping.",
          "PRD에는 인터뷰가 하나뿐이고, 그 인터뷰이는 문제가 중요하지 않다고 말한다(“별로 큰 문제가 아니라서 시도하지 않았다”). 고통 수치(“주 3–5회”, “최소 30분”)는 1인칭으로 쓰인 창업자 본인의 이야기다. 10장은 인터뷰이가 큰 문제가 아니라고 하면 멈추라고 하므로, 창업자 자신의 규칙대로라면 근거는 이미 중단을 가리킨다."],
      ko: "유일한 인터뷰가 ‘큰 문제 아니다’라고 했으니, PRD 스스로 정한 중단 기준에 이미 걸려 있다." },
    { t: ["No market size, and the segment shrinks every time you define it", "시장 규모가 없고, 정의할수록 세그먼트가 줄어든다"],
      b: ["No number anywhere. Foreign residents → coffee obsessives who can tell a semi-automatic shot from fully automatic → one ward with 50–100 cafes. “Is the core segment large enough, and reachable?” is listed as a risk at the end, but it is the question you have to answer before asking for money.",
          "어디에도 숫자가 없다. 외국인 거주자 → 반자동과 전자동 샷을 구별하는 커피 마니아 → 카페 50–100곳이 있는 구 하나. “핵심 세그먼트가 충분히 크고 도달 가능한가?”를 마지막에 리스크로 적었지만, 이건 돈을 요청하기 전에 답해야 할 질문이다."],
      ko: "시장 규모 숫자가 없고, 타깃을 정의할수록 더 좁아진다." },
    { t: ["The moat is a spreadsheet one person keeps up", "해자는 한 사람이 관리하는 스프레드시트다"],
      b: ["50–100 hand-curated cafes is easy to copy. User contributions are pushed to Later, and freshness depends on the founder re-checking every 6 months. The PRD names the risk “Will Google Maps / Tabelog add a ‘coffee type’ attribute?” without an answer, and the product hands its users to Google Maps on purpose.",
          "손으로 고른 카페 50–100곳은 베끼기 쉽다. 사용자 기여는 ‘나중’으로 밀렸고, 최신성은 창업자가 6개월마다 재확인하는 데 달려 있다. “구글맵·타베로그가 ‘커피 종류’ 속성을 추가하면?”이라는 리스크를 적어 놓고 답이 없으며, 제품은 일부러 사용자를 구글맵으로 보낸다."],
      ko: "1인 큐레이션 데이터는 해자가 아니고, 구글이 속성 하나 추가하면 끝난다." }
  ],
  othersLabel: ["Other issues", "기타 지적"],
  others: [
    ["No “why now”: nothing in the market, technology or policy makes 2026 the moment.", "‘왜 지금인가’가 없다. 시장·기술·정책 어디에도 2026년이어야 할 이유가 없다."],
    ["No “why this founder”: no coffee-industry network, audience or distribution.", "‘왜 이 창업자인가’가 없다. 커피 업계 네트워크도, 팬층도, 유통 채널도 없다."],
    ["The business model is a wish list: no buyer, price or conversation. Paid placement also undermines the “verified” neutrality.", "비즈니스 모델이 희망 목록이다. 구매자도, 가격도, 나눈 대화도 없다. 유료 노출은 ‘검증됨’의 중립성도 해친다."],
    ["Kill criteria are too lax: “nobody opens the page for one month” almost never fails, and recruiting on X/Threads selects people who already agree.", "중단 기준이 너무 느슨하다. ‘한 달간 아무도 안 열면’은 거의 걸리지 않고, X/Threads 모집은 이미 동의하는 사람만 고르게 된다."],
    ["Vision vs. scope: no path from a free single-ward finder to a company.", "비전과 범위가 맞지 않는다. 구 하나짜리 무료 파인더에서 회사로 가는 길이 없다."],
    ["The tourist segment needs many cities; v1 covers one ward.", "여행자 세그먼트는 여러 도시가 필요한데 v1은 구 하나만 다룬다."],
    ["The pain is overstated: the only interviewee spent zero minutes, not 30.", "고통이 과장됐다. 유일한 인터뷰이는 30분이 아니라 0분을 썼다."]
  ],
  asksLabel: ["What would change my mind", "내 생각을 바꿀 수 있는 것"],
  asks: [
    ["Finish M0: 8+ espresso-focused interviewees from outside your own network, 5+ rating the pain 4/5, with evidence of current workarounds.", "M0를 끝낼 것. 내 네트워크 밖의 에스프레소 중심 인터뷰이 8명 이상, 그중 5명 이상이 고통을 4/5 이상으로 평가하고 지금 쓰는 우회 방법의 증거가 있어야 한다."],
    ["A bottom-up market number: how many people fit the persona in the launch city, how you reach them, what one user costs.", "상향식 시장 숫자. 출시 도시에 페르소나에 맞는 사람이 몇 명인지, 어떻게 닿을지, 사용자 한 명을 얻는 데 얼마가 드는지."],
    ["A demand test before building: a Google Sheet or Notion list of 30 cafes posted to two communities, with return-visit and share numbers.", "만들기 전 수요 테스트. 카페 30곳을 담은 구글 시트나 노션 리스트를 커뮤니티 두 곳에 올리고 재방문·공유 수치를 볼 것."],
    ["A defensibility answer: a contribution model that scales without the founder, or a reason Google won’t add the attribute.", "방어력에 대한 답. 창업자 없이도 확장되는 기여 모델, 또는 구글이 그 속성을 추가하지 않을 이유."],
    ["One letter of intent from a roaster, equipment brand or relocation business, with a figure.", "로스터리·장비 브랜드·이주 지원 업체 중 한 곳의 의향서(금액 포함)."],
    ["Tighter kill criteria, e.g. fewer than 200 weekly users or under 20% week-2 retention at day 60.", "더 엄격한 중단 기준. 예) 60일 차에 주간 사용자 200명 미만, 또는 2주차 재방문율 20% 미만이면 중단."]
  ] },
{ id: "cpo", role: "CPO", area: "제품", verdict: "Back to discovery", verdictKo: "다시 조사 단계로", tone: "mid",
  lead: ["The only evidence in the PRD argues against the product, and the build plan doesn’t depend on fixing that.",
         "PRD에 있는 유일한 근거는 제품에 반대하는데, 개발 계획은 그 문제를 해결하는 것과 상관없이 짜여 있다."],
  objections: [
    { t: ["The problem is the founder’s, and the only outside data point disagrees", "문제는 창업자의 것이고, 유일한 외부 데이터는 동의하지 않는다"],
      b: ["The problem table is first-person; “3–5 times a week” is one person’s habit. The interview says “I just drank any coffee”. Kill criterion 1 has already fired, yet the plan schedules a prototype right after M0, and nothing says how many such signals stop the project.",
          "문제 표는 1인칭이고, “주 3–5회”는 한 사람의 습관이다. 인터뷰는 “그냥 아무 커피나 마셨다”고 말한다. 중단 기준 1은 이미 발동했는데도 계획은 M0 직후에 프로토타입을 잡아 두었고, 그런 신호가 몇 번 나와야 멈추는지도 정해져 있지 않다."],
      ko: "문제는 창업자 본인의 것이고, 외부 근거는 반대를 가리킨다." },
    { t: ["The primary user is the person who needs this product least", "주 사용자가 이 제품을 가장 덜 필요로 하는 사람이다"],
      b: ["The espresso regular already keeps a personal list. In one ward of 50–100 cafes they run out of discoveries within weeks, yet the target is ≥30% week-2 return and favorites are deferred. The tourist has the recurring discovery problem but is only secondary. “People who dislike dark roasts” are claimed but there is no roast field.",
          "에스프레소 단골은 이미 자기 리스트가 있다. 카페 50–100곳인 구 하나에서는 몇 주면 새로 발견할 게 없어지는데, 목표는 2주차 재방문 30% 이상이고 즐겨찾기는 뒤로 미뤄졌다. 계속 새 카페를 찾아야 하는 건 여행자인데 보조 사용자일 뿐이다. ‘다크 로스트를 싫어하는 사람’을 대상으로 꼽았지만 로스팅 필드는 없다."],
      ko: "주 타깃(에스프레소 단골)이 이 제품을 가장 덜 필요로 한다. 여행자가 더 맞을 수 있다." },
    { t: ["The core taxonomy doesn’t match the stated pain", "핵심 분류 체계가 말한 고통과 맞지 않는다"],
      b: ["F2 forces each cafe into one of three exclusive tags, but the problem itself says factory-made coffee shows up “especially for iced drinks” — a cafe with a machine plus pre-made iced coffee can’t be described. The persona is defined by semi-auto vs. fully automatic, but F3 can’t filter on it. The “Drip only” tag and “Fresh drip” filter don’t map to each other.",
          "F2는 카페마다 서로 배타적인 태그 세 개 중 하나만 고르게 하는데, 문제 정의 자체가 공장제 커피는 “특히 아이스 음료에서” 나온다고 말한다. 머신이 있으면서 아이스는 미리 만든 커피를 파는 카페를 표현할 수 없다. 페르소나는 반자동 대 전자동으로 정의되지만 F3로는 그걸 거를 수 없다. ‘Drip only’ 태그와 ‘Fresh drip’ 필터도 서로 대응하지 않는다."],
      ko: "카페당 태그 하나로는 ‘아이스만 공장제’ 같은 실제 고통을 표현할 수 없다." }
  ],
  othersLabel: ["Other issues", "기타 지적"],
  others: [
    ["Metrics measure activity: “<5 minutes” on hand-picked data isn’t comparable to the 30-minute baseline, and directions click-through measures a hand-off to Google.", "지표가 활동만 잰다. 손으로 고른 데이터에서의 ‘5분 미만’은 30분 기준과 비교할 수 없고, 길찾기 클릭률은 구글로 넘긴 횟수를 잴 뿐이다."],
    ["“Wrong-info reports <5%” can’t tell accurate data from users who didn’t bother to report.", "‘오류 신고 5% 미만’은 정확한 데이터와 굳이 신고하지 않은 사용자를 구별하지 못한다."],
    ["G3 “Prove demand in one area” has no threshold.", "G3 ‘한 지역에서 수요 입증’에 기준치가 없다."],
    ["The flow covers only the happy path: location denied, zero results, “open now”, UI language.", "사용자 흐름이 정상 경로만 다룬다. 위치 권한 거부, 결과 0개, ‘지금 영업 중’, UI 언어가 빠져 있다."],
    ["The data operation is unpriced: founder hours for visits and re-checks are never estimated.", "데이터 운영 비용이 계산되지 않았다. 방문과 재확인에 드는 창업자 시간을 추정하지 않았다."],
    ["“Verified” is undefined: machine photo is “when available” and the source can be just Instagram.", "‘검증됨’이 정의되지 않았다. 머신 사진은 ‘있을 때만’이고 출처가 인스타그램뿐일 수도 있다."],
    ["It cites documents that aren’t included (“an earlier FAQ draft”, “The Cut”, numbered Later items).", "포함되지 않은 문서를 인용한다(‘이전 FAQ 초안’, ‘The Cut’, 번호 붙은 ‘나중’ 항목)."]
  ],
  asksLabel: ["Required changes before build", "개발 전 필수 변경"],
  asks: [
    ["Run M0 and nothing else: a written screener and a concrete go rule (e.g. ≥5/8 rate 4+/5 and ≥4/8 have their own workaround). Delete M1/M2 until it passes.", "M0만 진행할 것. 서면 스크리너와 구체적인 진행 기준을 둔다(예: 8명 중 5명 이상이 4/5 이상, 4명 이상이 자기만의 우회 방법 보유). 통과 전까지 M1/M2는 지운다."],
    ["Pick one primary user, resident or tourist, and rebuild scope and retention around them.", "주 사용자를 거주자와 여행자 중 하나로 정하고, 범위와 재방문 지표를 그에 맞춰 다시 짤 것."],
    ["Make attributes independent: machine type, hot vs. iced preparation, drip method. Cover the persona’s distinction; add a roast field or drop the claim.", "속성을 독립적으로 나눌 것. 머신 종류, 핫/아이스 제조 방식, 드립 방식. 페르소나를 구분하는 기준을 다루고, 로스팅 필드를 추가하거나 그 주장을 뺀다."],
    ["Define “verified” per field and estimate the founder’s curation hours.", "필드별로 ‘검증됨’을 정의하고 창업자의 큐레이션 시간을 추정할 것."],
    ["Replace metrics: a post-visit “Was the coffee what you expected?”, an explicit G3 threshold, numeric kill criteria.", "지표를 바꿀 것. 방문 후 “기대한 커피였나요?” 질문, G3 기준치 명시, 숫자로 된 중단 기준."],
    ["Specify edge cases: location denied, zero results, open now, UI language.", "예외 상황을 명세할 것. 위치 거부, 결과 0개, 영업 중 여부, UI 언어."],
    ["Inline or delete the references to the FAQ and The Cut.", "FAQ와 The Cut 참조는 본문에 넣거나 삭제할 것."]
  ] },
{ id: "cmo", role: "CMO", area: "마케팅 · 성장", verdict: "A dataset with no distribution", verdictKo: "배포 계획 없는 데이터셋", tone: "bad",
  lead: ["The plan targets a niche the PRD cannot yet show exists, and it asks for a weekly habit from a product that people need once.",
         "이 계획은 PRD가 아직 존재를 보여주지 못한 틈새를 겨냥하고, 한 번 필요하고 마는 제품에 매주 쓰는 습관을 요구한다."],
  objections: [
    { t: ["The “first 1,000 users” plan is a single line", "‘첫 1,000명’ 계획이 한 줄뿐이다"],
      b: ["All of acquisition is M2: “share in foreign-resident and coffee communities.” No named communities, cadence, content angle or budget, and the founder is also visiting cafes. With “no install, no sign-up” and “No accounts in v1”, every visitor is anonymous and can’t be reached again.",
          "사용자 획득 전체가 M2의 “외국인 거주자·커피 커뮤니티에 공유”뿐이다. 커뮤니티 이름도, 주기도, 콘텐츠 방향도, 예산도 없고, 창업자는 카페 방문까지 해야 한다. “설치 없음, 가입 없음”과 “v1은 계정 없음” 때문에 모든 방문자는 익명이고 다시 연락할 수 없다."],
      ko: "사용자 획득 계획이 한 줄뿐이고, 계정이 없어 다시 부를 방법이 없다." },
    { t: ["The retention target conflicts with the success moment", "재방문 목표가 성공 순간과 충돌한다"],
      b: ["Success is “leaves the page with a destination”, then a hand-off to Google Maps. A regular in one ward finds their two cafes and never returns: no favorites, no alerts. Still the PRD targets ≥30% week-2 return. “3–5 times a week” is how often people drink coffee, not how often they search for it.",
          "성공은 “목적지를 정하고 페이지를 떠나는 것”이고, 그다음 구글맵으로 넘어간다. 구 하나에 사는 단골은 카페 두 곳을 찾으면 다시 오지 않는다. 즐겨찾기도 알림도 없다. 그런데도 PRD는 2주차 재방문 30% 이상을 목표로 한다. “주 3–5회”는 커피를 마시는 빈도지, 카페를 찾는 빈도가 아니다."],
      ko: "한 번 찾으면 끝나는 제품인데 2주차 재방문율 30%를 목표로 잡았다." },
    { t: ["Demand is unproven, and the one data point argues against it", "수요는 입증되지 않았고, 유일한 데이터가 반대를 가리킨다"],
      b: ["An enthusiast slice of a minority (foreign residents) inside one ward could be a few hundred people. G3 “Prove demand in one area” may succeed technically and still prove nothing about scale.",
          "구 하나 안에 있는 소수(외국인 거주자) 중 마니아층은 수백 명 정도일 수 있다. G3 ‘한 지역에서 수요 입증’은 형식상 성공해도 규모에 대해서는 아무것도 증명하지 못할 수 있다."],
      ko: "수요가 입증되지 않았고, 타깃이 수백 명 규모일 수 있다." }

  othersLabel: ["Other issues", "기타 지적"],
  others: [
    ["“Espresso Finder Japan” is a description, not a brand, and it excludes the drip and siphon users your own filters serve.", "‘Espresso Finder Japan’은 브랜드가 아니라 설명이고, 제품의 필터가 다루는 드립·사이폰 사용자를 배제한다."],
    ["Positioning leads with time saved (the founder’s 30 minutes). Lead with the outcome: “real espresso, not a button machine”.", "포지셔닝이 시간 절약(창업자의 30분)을 앞세운다. 결과를 앞세울 것: ‘버튼 머신이 아닌 진짜 에스프레소’."],
    ["The real competition is habit: Google Maps, Instagram coffee accounts, saved lists, Reddit r/JapanTravel. Your flow sends users back to Google Maps.", "진짜 경쟁 상대는 습관이다. 구글맵, 인스타그램 커피 계정, 저장 리스트, 레딧 r/JapanTravel. 그런데 이 제품의 흐름은 사용자를 다시 구글맵으로 보낸다."],
    ["No virality: no shareable list or card, and cafes are ignored as a distribution channel.", "바이럴 요소가 없다. 공유할 리스트나 카드가 없고, 카페를 유통 채널로 쓰지 않는다."],
    ["The kill criterion will never trigger; set e.g. <300 unique or <50 returning visitors in 8 weeks.", "중단 기준은 절대 걸리지 않는다. 예) 8주 안에 순방문자 300명 미만 또는 재방문자 50명 미만으로 정할 것."],
    ["No acquisition funnel metrics: no visitor target, channel attribution or cost per user.", "획득 퍼널 지표가 없다. 방문자 목표, 채널별 기여, 사용자당 비용이 없다."],
    ["The tourist segment is bigger and reachable through search, yet it is deprioritized.", "여행자 세그먼트가 더 크고 검색으로 닿을 수 있는데도 우선순위에서 밀렸다."]
  ],
  asksLabel: ["A concrete go-to-market fix", "구체적인 시장 진입 해법"],
  asks: [
    ["Lead with SEO: indexable pages per station, e.g. “Real espresso near Shibuya Station”.", "SEO를 앞세울 것. 역마다 검색되는 페이지를 만든다. 예) “시부야역 근처 진짜 에스프레소”."],
    ["Use cafes as a channel: a QR sticker and a ready-made Instagram post for each verified cafe.", "카페를 채널로 쓸 것. 검증된 카페마다 QR 스티커와 바로 올릴 수 있는 인스타그램 게시물을 준다."],
    ["Seed 3 named communities (subreddits, expat Facebook groups, university international offices) with posts that add value, not link drops.", "이름이 정해진 커뮤니티 3곳(서브레딧, 외국인 페이스북 그룹, 대학 국제교류처)에 링크만 던지지 말고 가치 있는 글을 올릴 것."],
    ["Add an optional email or LINE signup for “new verified cafes near you” before launch.", "출시 전에 ‘근처에 새로 검증된 카페’ 알림용 이메일·LINE 구독(선택)을 추가할 것."],
    ["Rename around a promise (e.g. “RealShot”, “Machine Check”) and test 3 names with the M0 interviewees.", "약속을 담은 이름으로 바꾸고(예: ‘RealShot’, ‘Machine Check’), M0 인터뷰이에게 이름 3개를 테스트할 것."],
    ["Replace metrics with a funnel and a numeric kill gate at week 8.", "지표를 퍼널로 바꾸고 8주 차에 숫자로 된 중단 관문을 둘 것."]
  ] },

      b: ["One casual drinker said “It wasn’t a big problem” — that says nothing about coffee people. The only evidence the problem is real is still the founder’s habit. Then “Interviews … are not a hard go/no-go gate”, M0 has no threshold, and the list is “a signal, not a verdict”. No M0 result can stop M1; that is a delay before building anyway, not discovery.",
          "커피를 가볍게 마시는 한 명이 “별로 큰 문제가 아니었다”고 했을 뿐, 이는 커피 퍼슨에 대해 아무것도 말해 주지 않는다. 문제가 실재한다는 근거는 여전히 창업자의 습관뿐이다. 그런데 “인터뷰는 … 관문이 아니다”라고 했고, M0에는 기준치가 없으며, 리스트는 “판결이 아니라 신호”다. 어떤 M0 결과도 M1을 멈추지 못한다. 이건 조사가 아니라 어차피 만들기 전의 지연일 뿐이다."],
      ko: "M0 결과로 개발이 멈출 수 없으니 조사가 아니다." },
    { t: ["You widened the user, but the product is built for the old one", "사용자는 넓혔는데 제품은 예전 사용자용이다"],
      b: ["§3 designs around discovery for the cafe hopper, resident or tourist. v1 ships about 30 cafes in one unnamed area, sorted by “Cafes near me” — the espresso regular’s feature. A hopper uses up 30 cafes in a month, and favorites and “new cafes” alerts are deferred. A tourist can only use it inside the launch area. The UI language isn’t set, while all three growth communities are English-speaking. Pick one user, one area, one language.",
          "3장은 거주자든 여행자든 카페 호퍼의 ‘발견’을 중심으로 설계한다고 했다. 그런데 v1은 이름도 정하지 않은 한 지역의 카페 30곳을 “내 근처” 순으로 보여준다. 이건 에스프레소 단골용 기능이다. 호퍼는 한 달이면 30곳을 다 쓰고, 즐겨찾기와 ‘새 카페’ 알림은 미뤄졌다. 여행자는 출시 지역 안에 있을 때만 쓸 수 있다. UI 언어도 정하지 않았는데 성장 커뮤니티 3곳은 모두 영어권이다. 사용자 하나, 지역 하나, 언어 하나를 고르라."],
      ko: "카페 호퍼를 주 사용자로 했지만 v1에는 다시 올 이유가 없다." },
    { t: ["None of the metrics can tell whether the goal was met", "어떤 지표도 목표 달성 여부를 알려주지 못한다"],
      b: ["The 5-minute test runs on your curated 30 cafes, so it will pass. Directions clicks measure intent, not whether the coffee matched the label. “Grows month over month” has no number — 3 to 4 visitors passes. The audit is 3 cafes, so one error gives 67%. One stray visit resets “no external traffic”, and Google adding a filter can’t be observed. Nobody can kill this project.",
          "5분 테스트는 직접 고른 30곳에서 하니 통과할 수밖에 없다. 길찾기 클릭은 의도를 잴 뿐, 커피가 표시와 맞았는지는 알 수 없다. “매달 성장”에는 숫자가 없어서 방문자 3명이 4명이 돼도 통과다. 감사는 3곳이라 하나만 틀려도 67%다. 길 잃은 방문 한 번이면 ‘외부 트래픽 0’이 초기화되고, 구글의 필터 추가는 관찰할 수 없다. 아무도 이 프로젝트를 멈출 수 없다."],
      ko: "지표는 모두 통과하게 돼 있고, 중단 기준은 발동할 수 없다." }
  ],
  othersLabel: ["Other issues", "기타 지적"],
  others: [
    ["“Official” is not official: anonymous Google Form self-reports get the same label as the cafe’s own menu.", "‘Official’은 공식이 아니다. 익명 구글 폼 자가 보고가 카페 자체 메뉴와 같은 등급을 받는다."],
    ["Evidence is one level per cafe while data is per base: you might have visited for hot espresso and only guessed at iced.", "증거 등급은 카페당 하나인데 데이터는 베이스별이다. 핫 에스프레소는 직접 봤어도 아이스는 짐작했을 수 있다."],
    ["The report flow can’t work on a static site: the “being re-checked” note appears only when you edit JSON and rebuild, and it isn’t rate-limited.", "신고 흐름은 정적 사이트에서 동작하지 않는다. ‘재확인 중’ 표시는 JSON을 직접 고치고 다시 빌드해야 나타나고, 횟수 제한도 아니다."],
    ["Taxonomy gaps: is batch brew held 4 hours “Fresh brew”? Should push-button fully automatic machines be hidden by default?", "분류의 빈틈. 4시간 보온한 배치 브루도 ‘Fresh brew’인가? 버튼식 전자동 머신은 기본으로 숨겨야 하나?"],
    ["Data is weakest where it matters: if the 30 cafes are specialty shops, nearly all are “Espresso, Visited” and the filter does nothing.", "데이터가 가장 필요한 곳에서 가장 약하다. 30곳이 스페셜티 카페라면 거의 전부 ‘에스프레소, Visited’라서 필터가 할 일이 없다."],
    ["§2 lists people who dislike dark roasts, but §6 drops roast level: remove the group or serve it.", "2장은 다크 로스트를 싫어하는 사람을 꼽지만 6장은 로스팅 정보를 뺐다. 그 집단을 빼거나 다뤄라."],
    ["“From today” overpromises for one area of about 30 cafes.", "카페 30곳짜리 한 지역에 ‘오늘부터’는 과한 약속이다."],
    ["Hours left to Google and a 12-month window let closed cafes stay listed — the worst outcome this product can produce.", "영업시간을 구글에 맡기고 12개월 기준을 두면 폐업한 카페가 남는다. 이 제품이 낼 수 있는 최악의 결과다."],
    ["F6 has no way to reach owners, so “≥5 self-reports” depends on luck.", "F6는 카페 주인에게 닿을 방법이 없어 ‘자가 보고 5곳 이상’은 운에 달려 있다."],
    ["Curation timing has no threshold that changes a decision; F7 station pages will be thin; empty states (no cafe in range, uncovered station, all filtered out) aren’t defined.", "큐레이션 시간 측정에는 결정을 바꿀 기준이 없고, F7 역 페이지는 빈약하며, 빈 화면(범위 내 카페 없음, 미지원 역, 전부 필터링됨)이 정의되지 않았다."]
  ],
  asksLabel: ["Required changes before build", "개발 전 필수 변경"],
  asks: [
    ["Give M0 a decision rule: e.g. ≥4 of 5 coffee people rate the pain ≥4 and keep a workaround list, and the list gets N saves or clicks from outside your circle. Miss it, don’t start M1.", "M0에 결정 기준을 둘 것. 예) 커피 퍼슨 5명 중 4명 이상이 고통을 4 이상으로 평가하고 우회 리스트를 갖고 있으며, 리스트가 지인 밖에서 저장·클릭 N회를 얻을 것. 못 미치면 M1을 시작하지 않는다."],
    ["Pick one primary user (espresso regular or hopper) and cut what doesn’t serve them; name the launch area and UI language to match your communities.", "주 사용자를 하나(에스프레소 단골 또는 호퍼) 고르고 그 사람에게 필요 없는 기능은 뺄 것. 출시 지역과 UI 언어를 정해 커뮤니티와 맞출 것."],
    ["Add a ground-truth metric: ask after the visit whether the coffee matched; replace “grows” with absolute targets for weekly external and returning visitors.", "실제 결과를 재는 지표를 추가할 것. 방문 후 커피가 표시와 맞았는지 묻고, ‘성장’ 대신 외부 주간 방문자와 재방문자의 절대 목표를 둘 것."],
    ["Fix the audit sample: audit all cafes, or at least 20, until the dataset passes 200.", "감사 표본을 고칠 것. 데이터가 200곳을 넘기 전까지는 전부, 또는 최소 20곳을 감사한다."],
    ["Numeric stop rules: e.g. <X external visitors a week for 3 months, or curation above Y hours a month.", "숫자로 된 중단 기준. 예) 3개월간 외부 주간 방문자 X명 미만, 또는 큐레이션이 월 Y시간 초과."],
    ["Split evidence levels — Visited / Official (published by the cafe) / Self-reported / Unconfirmed — recorded per base.", "증거 등급을 Visited / Official(카페가 직접 공개) / Self-reported / Unconfirmed로 나누고 베이스별로 기록할 것."],
    ["Close the taxonomy gaps: a hold-time limit for batch brew, and whether fully automatic machines are hidden by default.", "분류의 빈틈을 메울 것. 배치 브루 보온 시간 상한, 전자동 머신을 기본으로 숨길지 여부."],
    ["Rewrite F5 to match the static stack, and define the empty states.", "F5를 정적 스택에 맞게 다시 쓰고, 빈 화면을 정의할 것."]
  ] },
{ id: "v2-cmo", role: "CMO", area: "마케팅 · 성장", verdict: "A curation plan with a growth section attached", verdictKo: "성장 계획이 붙은 큐레이션 계획", tone: "bad",
  lead: ["No target audience for acquisition, no reason for anyone to come back, and no metric that could ever show it failing.", "획득할 대상도, 다시 올 이유도, 실패를 보여줄 지표도 없다."],
  objections: [
    { t: ["The name, positioning and channels point to three different audiences", "이름, 포지셔닝, 채널이 서로 다른 세 대상을 가리킨다"],
      b: ["The name is “Espresso Finder Japan”; the positioning claims cafe hoppers and dates; the three channels are English-speaking expat groups — while §2 names the behaviour カフェ巡り, and the largest pool of coffee people in Japan is Japanese. The site language is never stated. Dates choose on atmosphere, which §3 excludes. And “consider a name … later” means station pages build rankings under a name you plan to drop.",
          "이름은 ‘Espresso Finder Japan’, 포지셔닝은 카페 호퍼와 데이트까지 노리고, 채널 3곳은 영어권 외국인 그룹이다. 그런데 2장은 행동을 カフェ巡り라고 부르고, 일본에서 가장 큰 커피 퍼슨 집단은 일본인이다. 사이트 언어는 정해지지 않았다. 데이트 카페는 분위기로 고르는데 3장은 그걸 제외했다. 그리고 “이름은 나중에”라면 역 페이지는 버릴 이름으로 검색 순위를 쌓게 된다."],
      ko: "대상·언어·이름을 지금 정하라. 이름을 바꾸면 역 페이지 SEO가 초기화된다." },
    { t: ["There is no retention loop, and the core user runs out of content", "재방문 장치가 없고, 핵심 사용자는 볼 콘텐츠가 바닥난다"],
      b: ["§3 calls the cafe hopper the user with a “recurring need to discover”, then launches with about 30 cafes that “grow slowly”. Favorites, saved lists and email/LINE updates are all Later — no account, list, notification or feed. Nothing brings a user back except remembering the URL. The espresso regular stops needing it once they find one good shot.",
          "3장은 카페 호퍼를 ‘계속 새로 찾아야 하는’ 사용자라고 하면서, “천천히 늘어나는” 카페 30곳으로 출시한다. 즐겨찾기, 저장 리스트, 이메일/LINE 알림은 모두 ‘나중’이다. 계정도 리스트도 알림도 피드도 없다. URL을 기억하는 것 말고는 다시 올 이유가 없다. 에스프레소 단골은 좋은 한 곳을 찾으면 더 필요 없다."],
      ko: "두 사용자 모두 습관이 될 고리가 없다." },
    { t: ["The growth metrics cannot fail", "성장 지표는 실패할 수가 없다"],
      b: ["“Grows month over month” has no baseline — 4 to 5 visitors is success. “No external traffic for 3 months” never triggers. Friends forward the bare URL, so tagged links don’t exclude them, and cookie-less analytics can’t tell them apart. The 30% directions target is set before any traffic exists. And there is no retention metric at all — the most important number for a “recurring need”.",
          "“매달 성장”에는 기준선이 없어서 방문자 4명이 5명이 되면 성공이다. “3개월간 외부 트래픽 0”은 절대 발동하지 않는다. 지인은 태그 없는 URL을 전달하니 태그 링크로 걸러지지 않고, 쿠키 없는 분석으로는 구별할 수 없다. 길찾기 30% 목표는 트래픽이 생기기도 전에 정했다. 그리고 재방문 지표가 아예 없다. ‘반복되는 필요’를 내세운 제품에서 가장 중요한 숫자인데도."],
      ko: "숫자 없는 성장 목표, 그리고 재방문 지표의 부재." }
  ],
  othersLabel: ["Other issues", "기타 지적"],
  others: [
    ["Cafe self-reports have no distribution: QR stickers were cut, so how does an owner find F6?", "카페 자가 보고를 퍼뜨릴 방법이 없다. QR 스티커를 뺐으니 주인이 F6를 어떻게 알겠나?"],
    ["No word of mouth: no shareable hop list, no “Visited” badge for owners; Instagram photos are ruled out with no replacement.", "입소문 장치가 없다. 공유할 카페 순례 리스트도, 주인이 올릴 ‘Visited’ 배지도 없고, 인스타 사진은 막았는데 대안이 없다."],
    ["The real competition is saved Google lists, Instagram coffee accounts and the hopper’s own notes; the PRD never says why anyone would switch.", "진짜 경쟁 상대는 구글 저장 리스트, 인스타 커피 계정, 호퍼의 개인 메모다. 왜 갈아탈지 PRD는 말하지 않는다."],
    ["The community launch is three posts in total, and “useful content” has no format, cadence or owner.", "커뮤니티 출시는 총 3개의 글뿐이고, ‘유용한 콘텐츠’에는 형식도 주기도 담당자도 없다."],
    ["Recruiting interviewees in r/JapanLife burns the launch audience on research before the product exists.", "r/JapanLife에서 인터뷰이를 모으면 제품이 생기기도 전에 출시 대상을 조사에 써 버린다."],
    ["Stop condition 1 can’t be judged: who decides what counts as an “equivalent” filter?", "중단 조건 1은 판단할 수 없다. 무엇이 ‘동등한’ 필터인지 누가 정하나?"],
    ["The M0 list has no success threshold; define what the “signal” must be.", "M0 리스트에 성공 기준이 없다. ‘신호’가 무엇이어야 하는지 정하라."]
  ],
  asksLabel: ["A concrete go-to-market fix", "구체적인 시장 진입 해법"],
  asks: [
    ["Choose one launch audience and language in M0: Japanese-speaking カフェ巡り residents (X, Instagram, Threads) or English-speaking residents and visitors (Reddit, Facebook).", "M0에서 출시 대상과 언어를 하나로 정할 것. 일본어를 쓰는 カフェ巡り 거주자(X·인스타·Threads) 또는 영어를 쓰는 거주자와 여행자(레딧·페이스북)."],
    ["Rename before F7 ships, around the promise (“made here”, “pulled here”), and buy the domain once.", "F7 출시 전에 약속을 담은 이름(‘made here’, ‘pulled here’ 등)으로 바꾸고 도메인을 한 번에 살 것."],
    ["Go dense: 30 cafes across 3–4 adjacent stations, so each station page has 8+ entries.", "넓게 말고 촘촘하게. 30곳을 인접한 역 3–4곳에 몰아서 역 페이지마다 8곳 이상이 되게 할 것."],
    ["A weekly post in the chosen channel (“N cafes near X where the iced coffee is actually brewed on site”), each linking to a station page.", "선택한 채널에 매주 글 하나(“X역 근처 아이스 커피를 직접 내리는 카페 N곳”), 각각 역 페이지로 연결."],
    ["A minimal return loop without sign-up: a shareable hop list in the URL, plus a “new cafes this month” X account or RSS.", "가입 없는 최소한의 재방문 장치. URL에 담기는 공유용 순례 리스트와 ‘이번 달 새 카페’ X 계정이나 RSS."],
    ["Bring a cheap owner loop into v1: a badge and link every Visited cafe can post, which also drives F6.", "값싼 주인 루프를 v1에 넣을 것. Visited 카페마다 올릴 수 있는 배지와 링크. F6 유입도 늘린다."],
    ["Absolute metrics: ≥100 external weekly visitors by month 3, ≥300 by month 6, returning visitors, shares per post; stop if under 50 a week for 8 weeks.", "절대 수치 지표. 3개월 차 외부 주간 방문자 100명 이상, 6개월 차 300명 이상, 재방문자, 글당 공유 수. 8주 연속 주 50명 미만이면 중단."]
  ] },
{ id: "v2-cfo", role: "CFO", area: "수익 · 재무", verdict: "Cash is ¥0; founder hours are unbudgeted", verdictKo: "현금은 0, 창업자 시간은 예산 없음", tone: "mid",
  lead: ["The cash budget really is near zero. The budget that matters is the founder’s hours, and the PRD never sets a number for them. “Non-profit” doesn’t make it cheap; it only means nobody tracks the cost.",
         "현금 예산은 정말 0에 가깝다. 중요한 예산은 창업자의 시간인데, PRD는 거기에 숫자를 정하지 않았다. ‘비영리’라고 싸지는 게 아니라, 아무도 비용을 추적하지 않는다는 뜻일 뿐이다."],
  objections: [
    { t: ["“≈ ¥0 a month” counts the server and ignores the founder", "‘월 ≈ ¥0’은 서버만 세고 창업자는 빼먹었다"],
      b: ["The real cost is founder labour. “Visited” needs a train ride and a coffee every time. “Time the first 10 cafes” is a way to measure the cost, not a budget. The PRD never says how many hours a month the founder will give, so nothing can be checked against a limit.",
          "진짜 비용은 창업자의 노동이다. ‘Visited’ 등급은 매번 전철과 커피 한 잔이 든다. “처음 10곳의 시간을 잰다”는 비용을 재는 방법이지 예산이 아니다. PRD는 창업자가 한 달에 몇 시간을 쓸지 말하지 않으니, 상한과 비교할 대상이 없다."],
      ko: "시간 예산이 없어서 비용을 통제할 기준이 없다." },

// ---------- language ----------
const LANG_KEY = "espresso-review-docket-lang";
function getLang() { try { return localStorage.getItem(LANG_KEY) || "both"; } catch (e) { return "both"; } }
function setLang(l) {
  document.body.dataset.lang = l;
  document.querySelectorAll("#langSwitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
}
document.getElementById("langSwitch").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });

// ---------- state & storage ----------
const state = { judgments: {}, reviewers: {} };
let backend = null;
const chains = {};

function localBackend() {
  const KEY = "espresso-review-docket";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  state.judgments = saved.judgments || {};
  state.reviewers = saved.reviewers || {};
  return {
    kind: "local",
    async set(col, id, data) {
      state[col][id] = data;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
  };
}

function setNote(text, warn) {
  const el = document.getElementById("storeNote");
  el.textContent = text; el.classList.toggle("warn", !!warn);
}

async function connect() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) {
    backend = localBackend();
    setNote("이 브라우저에만 저장돼요. Claude는 이 판정을 읽을 수 없어요.", true);
    refreshAll();
    return;
  }
  backend = { kind: "db", set(col, id, data) { return db.collection(col).doc(id).set(data); } };
  const first = { judgments: false, reviewers: false };
  const timer = setTimeout(() => setNote("저장소에 아직 연결되지 않았어요. 잠시 후 다시 확인돼요.", true), 10000);
  const done = () => { if (first.judgments && first.reviewers) { clearTimeout(timer); setNote("판정은 자동 저장돼요. Claude가 읽고 PRD v0.2에 반영할 수 있어요."); } };
  for (const col of ["judgments", "reviewers"]) {
    db.collection(col).onSnapshot(snap => {
      const map = {};
      snap.docs.forEach(d => { if (d.exists) map[d.id] = d.data(); });
      state[col] = map;
      if (!snap.metadata.fromCache) { first[col] = true; done(); }
      refreshAll();
    }, err => {
      clearTimeout(timer);
      setNote(err.code === "revoked" ? "저장소 접근이 끊겼어요. 지금 보이는 판정은 저장되지 않아요." : "저장소 오류로 판정을 불러오지 못했어요.", true);
    });
  }
}

function save(col, id, data) {
  state[col][id] = data;
  refreshAll();
  if (!backend) return;
  chains[id] = (chains[id] || Promise.resolve())
    .then(() => backend.set(col, id, data))
    .catch(e => setNote(e && e.code === "invalid_argument" ? "이 화면에서는 판정을 저장할 권한이 없어요." : "저장하지 못했어요. 네트워크를 확인해 주세요.", true));
}

const timers = {};
function saveDebounced(col, id, getData) {
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => save(col, id, getData()), 700);
}

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bi = pair => `<span class="t-ko">${esc(pair[1])}</span><span class="t-en">${esc(pair[0])}</span>`;
const judged = rid => POINTS.filter(p => p.rid === rid && state.judgments[p.id]?.stance).length;
const total = rid => POINTS.filter(p => p.rid === rid).length;

// ---------- tabs ----------
function currentView() {
  const h = location.hash.slice(1);
  return (RBY[h] || SUMMARY_IDS[h]) ? h : "v2-summary";
}
const roundOf = v => SUMMARY_IDS[v] || ROUNDS.find(R => R.key === RBY[v].round);
let tabsRound = null;
function renderTabs(R) {
  tabsRound = R.key;
  const tabs = document.getElementById("tabs");
  const items = [{ id: R.summary, r: "요약" }, ...R.reviewers.map(r => ({ id: r.id, r: r.role }))];
  tabs.innerHTML = items.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-go="${t.id}"><span class="r">${t.r}</span><span class="p" data-prog="${t.id}"></span><span class="meter"><i data-bar="${t.id}"></i></span></button>`).join("");
}
function updateTabs() {
  const v = currentView(), R = roundOf(v);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.go === v)));
  const rp = POINTS.filter(p => RBY[p.rid].round === R.key);
  const all = rp.length, allJ = rp.filter(p => state.judgments[p.id]?.stance).length;
  for (const id of [R.summary, ...R.reviewers.map(r => r.id)]) {
    const j = id === R.summary ? allJ : judged(id), t = id === R.summary ? all : total(id);
    const pe = document.querySelector(`[data-prog="${id}"]`), be = document.querySelector(`[data-bar="${id}"]`);
    if (pe) pe.textContent = `${j}/${t}`;
    if (be) be.style.width = `${t ? (j / t) * 100 : 0}%`;
  }
}

// ---------- reviewer view ----------
function pointHTML(p, compact) {
  const head = p.kind === "o"
    ? `<h4><span class="num">반론 ${p.n}</span>${bi(p.text)}</h4><div class="txt">${bi(p.body)}</div><p class="ko"><b>한 줄 요약</b>${esc(p.ko)}</p>`
    : `<div class="txt">${bi(p.text)}</div>`;
  return `<article class="point ${compact ? "compact" : ""}" data-pid="${p.id}">
    ${head}
    <div class="row">
      <div class="seg" role="group" aria-label="판정">${STANCES.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="false">${l}</button>`).join("")}</div>
      <button type="button" class="notebtn" data-note-toggle>메모 쓰기</button>
    </div>
    <textarea id="note-${p.id}" data-note hidden placeholder="왜 그렇게 판단했나요? 예: 이 지적은 맞지만, 여행자로 바꾸면 커피 덕후 정체성이 흐려진다"></textarea>
  </article>`;
}

function renderReviewer(r) {
  const pts = POINTS.filter(p => p.rid === r.id);
  const sec = (label, kind, compact) => `<section class="block"><h3><span>${KIND_KO[kind]} · <span class="t-ko" style="display:inline">${esc(label[1])}</span><span class="t-en">${esc(label[0])}</span></span></h3>${pts.filter(p => p.kind === kind).map(p => pointHTML(p, compact)).join("")}</section>`;
  const numbers = r.numbers ? `<section class="block"><h3><span>대략 계산한 숫자 <span class="t-en">Back-of-envelope numbers</span></span><span>판정 대상 아님</span></h3><div class="numbers"><table>${r.numbers.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div></section>` : "";
  return `
    <div class="who">
      <span class="eyebrow">${esc(r.area)} 리뷰 · ${r.round === "v1" ? "PRD v0.1" : "PRD v0.2"}</span>
      <h2>${r.role} <small>“${esc(r.verdict)}”</small></h2>
      <span class="verdict ${r.tone}">판정 · ${esc(r.verdictKo)}</span>
      <div class="lead">${bi(r.lead)}</div>
    </div>
    ${sec(["Top 3", "가장 치명적인 3가지"], "o", false)}
    ${numbers}
    ${sec(r.othersLabel, "i", true)}
    ${sec(r.asksLabel, "a", true)}
    <section class="overall" data-rid="${r.id}">
      <h3>이 리뷰 자체는 얼마나 쓸모 있었나요?</h3>
      <div class="stars" role="group" aria-label="유용성">${[1,2,3,4,5].map(n => `<button type="button" data-useful="${n}" aria-pressed="false">${n} · ${["거의 없음","약간","보통","유용","매우 유용"][n-1]}</button>`).join("")}</div>
      <textarea id="overall-${r.id}" data-overall placeholder="이 리뷰어가 놓친 것, 과하게 본 것, 발표에서 방어할 논리"></textarea>
    </section>`;
}

function bindReviewer(r) {
  const main = document.getElementById("main");
  main.querySelectorAll(".point").forEach(el => {
    const id = el.dataset.pid, ta = el.querySelector("[data-note]");
    el.querySelector(".seg").addEventListener("click", e => {
      const b = e.target.closest("button[data-v]"); if (!b) return;
      const cur = state.judgments[id] || {};
      const stance = cur.stance === b.dataset.v ? null : b.dataset.v;
      save("judgments", id, { stance, note: ta.value, at: Date.now() });
    });
    el.querySelector("[data-note-toggle]").addEventListener("click", () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); });
    ta.addEventListener("input", () => saveDebounced("judgments", id, () => ({ stance: state.judgments[id]?.stance || null, note: ta.value, at: Date.now() })));
  });
  const ov = main.querySelector(".overall"), ota = ov.querySelector("[data-overall]");
  ov.querySelector(".stars").addEventListener("click", e => {
    const b = e.target.closest("[data-useful]"); if (!b) return;
    const n = Number(b.dataset.useful), cur = state.reviewers[r.id] || {};
    save("reviewers", r.id, { useful: cur.useful === n ? null : n, note: ota.value, at: Date.now() });
  });
  ota.addEventListener("input", () => saveDebounced("reviewers", r.id, () => ({ useful: state.reviewers[r.id]?.useful || null, note: ota.value, at: Date.now() })));
}

function applyReviewer(r) {
  const main = document.getElementById("main");
  main.querySelectorAll(".point").forEach(el => {
    const j = state.judgments[el.dataset.pid] || {}, ta = el.querySelector("[data-note]");
    el.dataset.stance = j.stance || "";
    el.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === j.stance)));
    if (document.activeElement !== ta) ta.value = j.note || "";
    if (j.note) ta.hidden = false;
    el.querySelector("[data-note-toggle]").textContent = ta.hidden ? "메모 쓰기" : "메모";
  });
  const ov = main.querySelector(".overall"); if (!ov) return;
  const rv = state.reviewers[r.id] || {}, ota = ov.querySelector("[data-overall]");
  ov.querySelectorAll("[data-useful]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.useful) === rv.useful)));
  if (document.activeElement !== ota) ota.value = rv.note || "";
}

// ---------- summary view ----------
function summaryMarkdown(R) {
  const RP = POINTS.filter(p => RBY[p.rid].round === R.key);
  const lines = ["# " + R.label + " 판정", ""];
  for (const [v, label] of [["agree", "동의 — 다음 버전에 반영"], ["partly", "일부 동의"], ["disagree", "반대 — 방어할 논리"]]) {
    const list = RP.filter(p => state.judgments[p.id]?.stance === v);
    lines.push(`## ${label} (${list.length})`);
    list.forEach(p => {
      lines.push(`- [${RBY[p.rid].role} · ${KIND_KO[p.kind]}] ${p.text[1]} (${p.text[0]})`);
      const n = state.judgments[p.id].note; if (n) lines.push(`  - 메모: ${n.replace(/\n/g, " ")}`);
    });
    lines.push("");
  }
  lines.push("## 리뷰어 유용성");
  R.reviewers.forEach(r => { const rv = state.reviewers[r.id] || {}; lines.push(`- ${r.role}: ${rv.useful ? rv.useful + "/5" : "-"}${rv.note ? " — " + rv.note.replace(/\n/g, " ") : ""}`); });
  return lines.join("\n");
}

function renderSummary(R) {
  const RP = POINTS.filter(p => RBY[p.rid].round === R.key);
  const count = v => RP.filter(p => state.judgments[p.id]?.stance === v).length;
  const open = RP.length - count("agree") - count("partly") - count("disagree");
  const group = (v, title, empty) => {
    const list = RP.filter(p => state.judgments[p.id]?.stance === v);
    return `<section class="block"><h3><span>${title}</span><span>${list.length}</span></h3><div class="list">${list.length ? list.map(p => {
      const n = state.judgments[p.id].note;
      return `<div class="li" data-stance="${v}"><span class="src">${RBY[p.rid].role} · ${KIND_KO[p.kind]} ${p.n}</span>${bi(p.text)}${n ? `<span class="note">${esc(n)}</span>` : ""}</div>`;
    }).join("") : `<div class="empty">${empty}</div>`}</div></section>`;
  };
  return `
    <div class="who"><span class="eyebrow">${R.label} · 전체 ${RP.length}개 지적</span><h2>내 판정 요약</h2>
      <p class="lead">리뷰어 탭에서 고른 판정이 여기 모여요. ‘동의’는 다음 버전에 반영할 목록, ‘반대’는 발표에서 방어할 논리예요.</p></div>
    <div class="tally">
      <div class="a"><b>${count("agree")}</b><span>동의</span></div>
      <div class="p"><b>${count("partly")}</b><span>일부 동의</span></div>
      <div class="d"><b>${count("disagree")}</b><span>반대</span></div>
      <div><b>${open}</b><span>아직 판정 안 함</span></div>
    </div>
    <section class="block"><h3><span>리뷰어들이 서로 모른 채 겹친 지적</span></h3>
      ${R.themes.map(t => `<div class="theme"><strong>${esc(t.t)}</strong><div class="chips">${R.reviewers.map(r => `<button type="button" class="chip ${t.who.includes(r.id) ? "" : "off"}" ${t.who.includes(r.id) ? `data-go="${r.id}"` : "disabled"}>${r.role}</button>`).join("")}</div></div>`).join("")}
    </section>
    <div class="grid2">
      ${group("agree", "동의 — 다음 버전에 반영","아직 없어요. 리뷰어 탭에서 ‘동의’를 고르면 여기 쌓여요.")}
      ${group("disagree", "반대 — 방어할 논리", "아직 없어요. 반대하는 지적엔 메모로 이유를 남겨 두세요.")}
    </div>
    ${group("partly", "일부 동의", "아직 없어요.")}
    <section class="block"><h3><span>리뷰어 유용성</span></h3><div class="list">${R.reviewers.map(r => { const rv = state.reviewers[r.id] || {}; return `<div class="li"><span class="src">${r.role} · ${esc(r.verdictKo)}</span><span>${rv.useful ? `${rv.useful}/5` : "평가 안 함"}</span>${rv.note ? `<span class="note">${esc(rv.note)}</span>` : ""}</div>`; }).join("")}</div></section>
    <section class="block"><h3><span>내보내기</span></h3>
      <div class="actions"><button type="button" class="btn" id="copyBtn">판정을 마크다운으로 복사</button><span class="toast" id="copyToast"></span></div>
      <textarea id="copybox" hidden readonly></textarea>
    </section>`;
}
function bindSummary() {
  const main = document.getElementById("main");
  main.querySelectorAll(".chip[data-go]").forEach(c => c.addEventListener("click", () => location.hash = c.dataset.go));
  main.querySelector("#copyBtn").addEventListener("click", () => {
    const text = summaryMarkdown(roundOf(shown)),toast = main.querySelector("#copyToast"), box = main.querySelector("#copybox");
    const fallback = () => { box.hidden = false; box.value = text; box.select(); toast.textContent = "아래 텍스트를 직접 복사하세요."; };
    try { navigator.clipboard.writeText(text).then(() => { toast.textContent = "복사했어요."; }, fallback); } catch (e) { fallback(); }
  });
}

// ---------- routing ----------
let shown = null;
function show() {
  const v = currentView(), main = document.getElementById("main");
  shown = v;
  const R = roundOf(v);
  if (tabsRound !== R.key) renderTabs(R);
  document.querySelectorAll("#roundSwitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.round === R.key)));
  if (SUMMARY_IDS[v]) { main.innerHTML = renderSummary(R); bindSummary(); }
  else { const r = RBY[v]; main.innerHTML = renderReviewer(r); bindReviewer(r); applyReviewer(r); }
  updateTabs();
  document.getElementById(`tab-${v}`)?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
function refreshAll() {
  updateTabs();
  if (SUMMARY_IDS[shown]) {
    const box = document.getElementById("copybox");
    if (!box || box.hidden) { document.getElementById("main").innerHTML = renderSummary(SUMMARY_IDS[shown]); bindSummary(); }
  } else if (shown) applyReviewer(RBY[shown]);
}
window.addEventListener("hashchange", () => { show(); window.scrollTo({ top: 0 }); });

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) location.hash = b.dataset.go; });
document.getElementById("roundSwitch").addEventListener("click", e => {
  const b = e.target.closest("[data-round]"); if (!b) return;
  location.hash = ROUNDS.find(R => R.key === b.dataset.round).reviewers[0].id;
});
if (!location.hash) history.replaceState(null, "", "#v2-ceo");
show();
connect();
</script>
